<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gpu-quote-normalizer · KT video</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b24; --panel2: #1c2230; --line: #2a3242;
    --text: #e8ebf2; --muted: #8b94a7; --dim: #5d6679;
    --blue: #5aa9ff;    /* incoming data */
    --amber: #f3b54a;   /* needs a human */
    --red: #ff6b6b;     /* invalid / rejected */
    --green: #45c486;   /* ok / comparable */
    --violet: #a78bfa;  /* stored state */
    --display: "Bahnschrift", "Segoe UI Semibold", "Segoe UI", sans-serif;
    --body: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #05070a; color: var(--text); font-family: var(--body); }
  body.render { overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background:
           radial-gradient(1400px 800px at 70% 20%, #141a25 0%, var(--bg) 60%); transform-origin: 0 0; }
  .scene { position: absolute; inset: 0; opacity: 0; display: none; }
  .abs { position: absolute; }
  .chapter { position: absolute; left: 120px; top: 52px; font: 600 22px var(--mono); color: var(--muted);
             letter-spacing: .04em; }
  .chapter b { color: var(--blue); font-weight: 600; }
  .headline { position: absolute; left: 120px; top: 100px; font: 600 56px var(--display); letter-spacing: -.01em; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .box { position: absolute; border: 2px solid var(--line); border-radius: 14px; background: var(--panel);
         display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .box .t { font: 600 28px var(--mono); }
  .box .s { font: 400 19px var(--body); color: var(--muted); margin-top: 6px; }
  .b-blue { border-color: var(--blue); } .b-violet { border-color: var(--violet); }
  .b-amber { border-color: var(--amber); } .b-green { border-color: var(--green); } .b-red { border-color: var(--red); }
  .c-blue { color: var(--blue); } .c-violet { color: var(--violet); } .c-amber { color: var(--amber); }
  .c-green { color: var(--green); } .c-red { color: var(--red); }
  .dashed { border-style: dashed; }
  .chip { position: absolute; padding: 6px 16px; border-radius: 999px; font: 500 20px var(--mono);
          border: 2px solid var(--line); background: var(--panel); white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 12px; border-radius: 999px; font: 600 17px var(--mono); }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  svg.layer { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  svg line { stroke-linecap: round; }
  /* code panel */
  .code { position: absolute; background: #0b0e14; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .code .hdr { height: 46px; display: flex; align-items: center; padding: 0 20px; font: 500 19px var(--mono);
               color: var(--muted); border-bottom: 1px solid var(--line); background: #10141c; }
  .code .hdr b { color: var(--text); font-weight: 500; }
  .code .row { position: relative; display: flex; white-space: pre; font-family: var(--mono); }
  .code .row .hl { position: absolute; inset: 0; background: rgba(90,169,255,.16); border-left: 4px solid var(--blue); opacity: 0; }
  .code .row .ln { position: relative; width: 70px; text-align: right; padding-right: 18px; color: var(--dim); }
  .code .row .tx { position: relative; color: #d7dce6; }
  .kw { color: #c792ea; } .st { color: #9ece6a; } .fn { color: #7dcfff; } .cm { color: var(--dim); }
  /* grid (scene 3) */
  .cell { position: absolute; height: 44px; border: 1px solid var(--line); display: flex; align-items: center;
          padding: 0 10px; font: 18px var(--mono); white-space: nowrap; overflow: hidden; }
  /* preview controls */
  #controls { display: none; gap: 12px; align-items: center; padding: 10px 16px; font: 14px var(--body); color: var(--muted); }
  body.preview #controls { display: flex; }
  #controls input[type=range] { flex: 1; }
  #controls button { font: 600 14px var(--body); padding: 6px 14px; border-radius: 6px; border: 1px solid #333; background: #1a1f29; color: #eee; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <div class="chapter" id="chapter"></div>
  <div class="abs" id="progress" style="left:0;bottom:0;height:4px;background:#2b3546;width:0"></div>
</div>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1000" step="1" value="0">
  <span id="clock" class="mono">0.00</span>
</div>

<script src="timing.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- helpers (pure functions of t)
const T = window.TIMING;
const stage = document.getElementById("stage");
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, t0, d = 0.6) => ease((t - t0) / d);
const win = (t, a, b, d = 0.5) => Math.min(prog(t, a, d), 1 - prog(t, b, 0.4));
const lerp = (a, b, p) => a + (b - a) * p;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
window.__missingAnchors = [];

function show(id, p, dx = 0, dy = 24) {
  const e = $(id); if (!e) return;
  e.style.opacity = p;
  e.style.transform = `translate(${dx * (1 - p)}px, ${dy * (1 - p)}px)`;
  e.style.visibility = p <= 0.001 ? "hidden" : "visible";
}
// An arrow is an SVG line plus an explicit triangle head (id + "-hd").
function arrow(id, color, width = 3, dash = "") {
  return `<line id="${id}" stroke="${color}" stroke-width="${width}" ${dash ? `stroke-dasharray="${dash}"` : ""}/>` +
         `<path id="${id}-hd" d="M0,0 L-16,-8 L-16,8 z" fill="${color}"/>`;
}
function drawLine(id, x1, y1, x2, y2, p) {
  const e = $(id);
  const ang = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
  const ex = lerp(x1, x2, p), ey = lerp(y1, y2, p);
  // stop the shaft where the head begins
  const back = Math.min(12, len * p);
  e.setAttribute("x1", x1); e.setAttribute("y1", y1);
  e.setAttribute("x2", ex - Math.cos(ang) * back); e.setAttribute("y2", ey - Math.sin(ang) * back);
  e.style.opacity = p > 0.02 ? 1 : 0;
  const hd = $(`${id}-hd`);
  if (hd) {
    hd.setAttribute("transform", `translate(${ex},${ey}) rotate(${(ang * 180) / Math.PI})`);
    hd.style.opacity = p > 0.15 ? 1 : 0;
  }
}
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9'\-]/g, "");
function anchors(scene) {
  const toks = scene.words.map((w) => ({ k: norm(w.w), s: w.s })).filter((x) => x.k);
  const cache = {};
  return (phrase, off = 0) => {
    if (!(phrase in cache)) {
      const p = phrase.split(/\s+/).map(norm).filter(Boolean);
      cache[phrase] = null;
      for (let i = 0; i + p.length <= toks.length && cache[phrase] === null; i++) {
        if (p.every((k, j) => toks[i + j].k === k)) cache[phrase] = toks[i].s;
      }
      if (cache[phrase] === null) { window.__missingAnchors.push(`${scene.id}: ${phrase}`); cache[phrase] = 0; }
    }
    return cache[phrase] + off;
  };
}

// Minimal Python highlighter for code-focus panels.
function pyHtml(src) {
  const re = /(f?"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|if|for|in|return|raise|else|not|and|or|None|True|False)\b|\b([a-z_]+)(?=\()|(#.*$)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "st" : m[2] ? "kw" : m[3] ? "fn" : "cm";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}
// lines: [[lineNo|"", text], ...]; common indentation is removed for display.
function codePanel(id, { x, y, w, path, range, lines, size = 20, lh = 32 }) {
  const ind = Math.min(...lines.filter(([, s]) => s.trim() && s.trim() !== "…").map(([, s]) => s.match(/^ */)[0].length));
  const rows = lines.map(([n, s], i) => {
    const txt = s.trim() === "…" ? `<span class="cm">${" ".repeat(Math.max(0, s.indexOf("…") - ind))}…</span>` : pyHtml(s.slice(ind));
    return `<div class="row" id="${id}-r${i}" style="font-size:${size}px;line-height:${lh}px"><div class="hl" id="${id}-h${i}"></div>` +
           `<span class="ln">${n}</span><span class="tx">${txt}</span></div>`;
  }).join("");
  return `<div class="code" id="${id}" style="left:${x}px;top:${y}px;width:${w}px">` +
         `<div class="hdr"><b>${esc(path)}</b>&nbsp;&nbsp;${esc(range)}</div><div style="padding:10px 0">${rows}</div></div>`;
}
// steps: [[t0, [row indices]], ...] in time order. Highlighted rows glow; the rest dim.
function codeFocus(id, n, steps, t) {
  const amt = new Array(n).fill(0); let any = 0;
  steps.forEach(([t0, idx], k) => {
    const t1 = k + 1 < steps.length ? steps[k + 1][0] : 1e9;
    const p = win(t, t0, t1, 0.45);
    any = Math.max(any, p);
    idx.forEach((i) => { amt[i] = Math.max(amt[i], p); });
  });
  for (let i = 0; i < n; i++) {
    $(`${id}-h${i}`).style.opacity = amt[i];
    $(`${id}-r${i}`).style.opacity = 1 - 0.5 * any * (1 - amt[i]);
  }
}

// ---------------------------------------------------------------- scenes
const S = {};   // id -> { html, draw(t, A, dur) }

// 01 · The problem ------------------------------------------------
S["01"] = {
  html: () => {
    const docs = [["quote.csv", "CSV"], ["quotation.xlsx", "XLSX"], ["RE: H100 pricing.eml", "email"]];
    const fields = ["gpu_sku", "gpus_per_node", "node_count", "condition", "location", "unit_price_usd",
                    "total_price_usd", "lead_time_days", "dealer", "valid_until"];
    const axisX = (k) => 920 + (k - 200) / 40 * 820;
    return `
    <div class="headline" id="s1-h">Quotes arrive as files, not records</div>
    ${docs.map(([n, k], i) => `
      <div class="card b-blue" id="s1-doc${i}" style="left:140px;top:${250 + i * 170}px;width:540px;height:140px;border:2px solid var(--blue)">
        <div class="mono c-blue" style="position:absolute;left:24px;top:18px;font-size:24px">${esc(n)}</div>
        <div class="pill" style="position:absolute;right:20px;top:18px;background:#1d2a3d;color:var(--blue)">${k}</div>
        ${[0, 1, 2].map((j) => `<div style="position:absolute;left:24px;top:${70 + j * 20}px;height:8px;border-radius:4px;background:#2a3446;width:${[420, 340, 380][j] - i * 30}px"></div>`).join("")}
      </div>`).join("")}
    <div class="card" id="s1-rec" style="left:140px;top:250px;width:540px;height:480px;border:2px solid var(--line)">
      <div style="position:absolute;left:24px;top:16px;font:600 26px var(--display)">Quote record</div>
      <div class="muted" style="position:absolute;right:24px;top:22px;font-size:18px">one strict schema</div>
      ${fields.map((f, i) => `<div class="mono" style="position:absolute;left:24px;top:${66 + i * 40}px;font-size:21px">${f}</div>
        <div style="position:absolute;right:24px;top:${74 + i * 40}px;width:180px;height:10px;border-radius:5px;background:#263043"></div>`).join("")}
    </div>
    <div class="abs" id="s1-axis" style="left:0;top:0;width:1920px;height:520px">
      <div class="abs" style="left:880px;top:250px;font:600 30px var(--display)">Similar nodes, different dealers</div>
      <div class="abs mono c-blue" style="left:880px;top:300px;font-size:24px">$200k – $240k per quote</div>
      <div class="abs" style="left:920px;top:410px;width:820px;height:3px;background:#3a4456"></div>
      ${[200, 210, 220, 230, 240].map((k) => `<div class="abs" style="left:${axisX(k) - 1}px;top:402px;width:2px;height:18px;background:#3a4456"></div>
        <div class="abs mono muted" style="left:${axisX(k) - 40}px;top:428px;width:80px;text-align:center;font-size:19px">$${k}k</div>`).join("")}
      ${[200, 211, 219, 228, 240].map((k, i) => `<div class="abs" id="s1-dot${i}" style="left:${axisX(k) - 13}px;top:398px;width:26px;height:26px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 6px rgba(90,169,255,.18)"></div>`).join("")}
      <div class="abs muted" style="left:880px;top:470px;font-size:18px">Range from the founders' public Launch YC post · dots illustrative</div>
    </div>
    <div class="card" id="s1-bad" style="left:880px;top:560px;width:430px;height:220px;border:2px solid var(--green)">
      <div class="mono muted" style="position:absolute;left:24px;top:20px;font-size:20px">gpu_sku</div>
      <div class="mono" style="position:absolute;left:24px;top:56px;font-size:28px">H100-PCIE-80GB</div>
      <div class="pill" style="position:absolute;right:20px;top:18px;background:rgba(69,196,134,.15);color:var(--green)">ok</div>
      <div id="s1-x" style="position:absolute;left:24px;top:120px;font:600 22px var(--body);color:var(--red)">✗ looks clean, but it is wrong</div>
      <div class="muted" style="position:absolute;left:24px;top:170px;font-size:18px">silently wrong → wrong comparison</div>
    </div>
    <div class="card" id="s1-flag" style="left:1350px;top:560px;width:450px;height:220px;border:2px solid var(--amber)">
      <div class="mono muted" style="position:absolute;left:24px;top:20px;font-size:20px">gpu_sku</div>
      <div class="mono" style="position:absolute;left:24px;top:56px;font-size:28px">"H100"</div>
      <div class="pill" style="position:absolute;right:20px;top:18px;background:rgba(243,181,74,.15);color:var(--amber)">ambiguous</div>
      <div style="position:absolute;left:24px;top:120px;font:600 22px var(--body);color:var(--amber)">→ review: matches SXM5 and PCIe</div>
      <div class="muted" style="position:absolute;left:24px;top:170px;font-size:18px">flagged → a human decides</div>
    </div>
    <div class="abs" id="s1-moral" style="left:880px;top:820px;font:600 60px var(--display)">Flag it. <span class="c-amber">Don't guess.</span></div>`;
  },
  draw(t, A) {
    show("s1-h", 1, 0, 0);
    const merge = prog(t, A("to compare them"), 0.9);
    for (let i = 0; i < 3; i++) {
      const p = prog(t, 0.15 + i * 0.45, 0.7);
      const e = $(`s1-doc${i}`);
      e.style.opacity = p * (1 - merge);
      e.style.transform = `translate(${-60 * (1 - p) + 0 * merge}px, ${merge * (250 + 170 - (250 + i * 170))}px) scale(${1 - 0.15 * merge})`;
    }
    show("s1-rec", prog(t, A("to compare them", 0.4), 0.8), 0, 0);
    const ax = prog(t, A("two hundred"), 0.7);
    show("s1-axis", ax, 0, 16);
    for (let i = 0; i < 5; i++) {
      const p = prog(t, A("two hundred", 0.3 + i * 0.25), 0.5);
      const d = $(`s1-dot${i}`); d.style.opacity = p; d.style.transform = `translateY(${-30 * (1 - p)}px)`;
    }
    show("s1-bad", prog(t, A("and a wrong value")), 0, 30);
    $("s1-x").style.opacity = prog(t, A("looks clean", 0.6), 0.5);
    show("s1-flag", prog(t, A("worse than one")), 0, 30);
    show("s1-moral", prog(t, A("gets flagged"), 0.7), 0, 20);
  },
};

// 02 · Architecture ------------------------------------------------
const S2X = (i) => 120 + i * 330;
S["02"] = {
  html: () => {
    const boxes = [
      ["file", "CSV · XLSX · email", "b-blue", "c-blue"],
      ["raw_files", "bytes + SHA-256", "b-violet", "c-violet"],
      ["parse_file()", "spreadsheet | email", "", ""],
      ["normalize_quote()", "SKU catalog · money · dates", "", ""],
      ["validate()", "cross-field checks", "", ""],
    ];
    return `
    <div class="headline">One pipeline, one log</div>
    ${boxes.map(([t, s, b, c], i) => `<div class="box ${b}" id="s2-b${i}" style="left:${S2X(i)}px;top:420px;width:260px;height:110px">
      <div class="t ${c}" style="font-size:${t.length > 14 ? 23 : 28}px">${t}</div><div class="s">${s}</div></div>`).join("")}
    <div class="box b-blue dashed" id="s2-gap" style="left:${S2X(2)}px;top:236px;width:260px;height:96px">
      <div class="t" style="font-size:24px">gap-filler</div><div class="s">mock | LLM · optional<br>locates text only</div></div>
    <div class="box b-violet" id="s2-ev" style="left:450px;top:690px;width:760px;height:100px">
      <div class="t c-violet">events</div><div class="s">append-only log · UPDATE / DELETE blocked</div></div>
    <div class="box" id="s2-proj" style="left:1290px;top:690px;width:240px;height:100px">
      <div class="t" style="font-size:26px">project()</div><div class="s">replay → current quotes</div></div>
    <div class="box b-amber" id="s2-rev" style="left:1610px;top:620px;width:230px;height:84px">
      <div class="t c-amber" style="font-size:23px">review queue</div></div>
    <div class="box b-green" id="s2-cmp" style="left:1610px;top:776px;width:230px;height:84px">
      <div class="t c-green" style="font-size:23px">compare()</div></div>
    <div class="abs muted" id="s2-note" style="left:120px;top:900px;font-size:24px">Plain code does the exact work. The optional model only points at text.</div>
    <svg class="layer">
      ${[0, 1, 2, 3].map((i) => arrow(`s2-a${i}`, "#8b94a7")).join("")}
      ${[1, 2, 3, 4].map((i) => arrow(`s2-d${i}`, "#a78bfa", 2.5, "7 7")).join("")}
      ${arrow("s2-g", "#5aa9ff", 2.5, "7 7")}
      ${arrow("s2-e1", "#8b94a7")}${arrow("s2-e2", "#f3b54a")}${arrow("s2-e3", "#45c486")}
    </svg>`;
  },
  draw(t, A) {
    const at = [A("a file comes in"), A("raw bytes"), A("a parser reads"), A("a normalizer"), A("validators check")];
    at.forEach((a, i) => show(`s2-b${i}`, prog(t, a, 0.6), -20, 0));
    for (let i = 0; i < 4; i++) {
      drawLine(`s2-a${i}`, S2X(i) + 262, 475, S2X(i + 1) - 6, 475, prog(t, at[i + 1] - 0.1, 0.5));
    }
    const ev = A("every step");
    show("s2-ev", prog(t, ev, 0.6), 0, 20);
    for (let i = 1; i <= 4; i++) {
      drawLine(`s2-d${i}`, S2X(i) + 130, 532, Math.max(470, Math.min(1190, S2X(i) + 130)), 686, prog(t, ev + 0.3 + i * 0.15, 0.5));
    }
    const lg = A("append-only log");
    show("s2-proj", prog(t, lg + 0.3, 0.5), -20, 0);
    drawLine("s2-e1", 1212, 740, 1286, 740, prog(t, lg + 0.2, 0.4));
    show("s2-rev", prog(t, lg + 0.8, 0.5), -20, 0);
    show("s2-cmp", prog(t, lg + 1.0, 0.5), -20, 0);
    drawLine("s2-e2", 1532, 722, 1604, 668, prog(t, lg + 0.7, 0.4));
    drawLine("s2-e3", 1532, 758, 1604, 812, prog(t, lg + 0.9, 0.4));
    const g = A("and an l-l-m");
    show("s2-gap", prog(t, g, 0.6), 0, -20);
    drawLine("s2-g", S2X(2) + 130, 334, S2X(2) + 130, 414, prog(t, g + 0.4, 0.4));
    show("s2-note", prog(t, A("find text", 0.3), 0.6), 0, 12);
  },
};

// 03 · One row, end to end --------------------------------------
const S3_COLS = ["Model", "GPU Count", "Qty", "Cond", "Ships From", "Price/Node", "Extended Price", "Lead Time", "Expires", "Currency", "Warranty"];
const S3_ROW = ["H100 SXM", "8", "16", "new", "San Jose, CA", "$238,000.00", "$3,820,000.00", "3 weeks", "Nov 22, 2026", "USD", "1 year"];
const S3_ST = ["ingest()", "parse_spreadsheet()", "normalize_quote()", "validate()"];
const S3X = (i) => 120 + i * 440;
const S3_CODE = [
  [22, '    unit, nodes, total = out["unit_price_usd"], out["node_count"], out["total_price_usd"]'],
  [23, '    if all(f.status == Status.OK for f in (unit, nodes, total)):'],
  [24, '        expected = round(float(unit.value) * int(nodes.value), 2)'],
  [25, '        if abs(float(total.value) - expected) > TOLERANCE_USD:'],
  [26, '            out["total_price_usd"] = total.model_copy(update={'],
  [27, '                "status": Status.INVALID,'],
  [28, '                "code": "total_mismatch",'],
  [29, '                "reason": (f"total ${float(total.value):,.2f} ≠ unit ${float(unit.value):,.2f} "'],
  [30, '                           f"× {nodes.value} nodes = ${expected:,.2f}"),'],
  [31, '            })'],
];
S["03"] = {
  html: () => {

// ---------------------------------------------------------------- build + renderAt
const scenes = T.scenes.map((sc, i) => {
  const el = document.createElement("div");
  el.className = "scene"; el.id = `scene-${sc.id}`;
  el.innerHTML = S[sc.id].html();
  stage.insertBefore(el, $("progress"));
  return { ...sc, el, idx: i, A: anchors(sc), def: S[sc.id] };
});
// Resolve every anchor once up front so missing phrases are reported immediately.
scenes.forEach((sc) => sc.def.draw(0, sc.A, sc.duration));

window.renderAt = function renderAt(seconds) {
  const t = Math.max(0, Math.min(seconds, T.total - 1e-6));
  let cur = scenes[scenes.length - 1];
  for (const sc of scenes) { if (t >= sc.start && t < sc.start + sc.duration) { cur = sc; break; } }
  for (const sc of scenes) { if (sc !== cur) { sc.el.style.display = "none"; } }
  const local = t - cur.start;
  const first = cur.idx === 0, last = cur.idx === scenes.length - 1;
  const fin = first ? 1 : ease(local / 0.35);
  const fout = last ? 1 : 1 - ease((local - (cur.duration - 0.3)) / 0.3);
  cur.el.style.display = "block";
  cur.el.style.opacity = Math.min(fin, fout);
  cur.def.draw(local, cur.A, cur.duration);
  const ch = $("chapter");
  ch.innerHTML = last ? "" : `<b>${cur.id}</b> / ${esc(cur.chapter)}`;
  ch.style.opacity = Math.min(fin, fout);
  $("progress").style.width = `${(t / T.total) * 1920}px`;
  return cur.id;
};
window.TOTAL = T.total;

// ---------------------------------------------------------------- preview mode (not used by the renderer)
const params = new URLSearchParams(location.search);
if (params.has("render")) {
  document.body.classList.add("render");
} else {
  document.body.classList.add("preview");
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080); stage.style.transform = `scale(${s})`;
                      stage.style.marginBottom = `${-1080 * (1 - s)}px`; stage.style.marginRight = `${-1920 * (1 - s)}px`; };
  addEventListener("resize", fit); fit();
  const scrub = $("scrub"), clock = $("clock"), btn = $("play");
  const audio = new Audio("out/narration.wav");
  let playing = false, t0 = 0, w0 = 0, haveAudio = false;
  audio.addEventListener("canplay", () => { haveAudio = true; });
  const setT = (t) => { renderAt(t); scrub.value = Math.round((t / T.total) * 1000); clock.textContent = t.toFixed(2); };
  scrub.addEventListener("input", () => { const t = (scrub.value / 1000) * T.total; if (haveAudio) audio.currentTime = t; w0 = t; t0 = performance.now(); setT(t); });
  btn.addEventListener("click", () => {
    playing = !playing; btn.textContent = playing ? "Pause" : "Play";
    w0 = (scrub.value / 1000) * T.total; t0 = performance.now();
    if (haveAudio) { audio.currentTime = w0; playing ? audio.play() : audio.pause(); }
    if (playing) requestAnimationFrame(tick);
  });
  function tick() {
    if (!playing) return;
    const t = haveAudio ? audio.currentTime : w0 + (performance.now() - t0) / 1000;
    setT(t);
    if (t >= T.total) { playing = false; btn.textContent = "Play"; return; }
    requestAnimationFrame(tick);
  }
  setT(params.has("t") ? parseFloat(params.get("t")) : 0);
}
